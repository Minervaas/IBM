<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Study Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────────────── -->
  <nav class="navbar">
    <a class="nav-brand" href="{{ url_for('index') }}">📚 Study Planner</a>
    <a class="btn btn-primary" href="{{ url_for('new_task') }}">+ Add Task</a>
  </nav>

  <!-- ── Flash messages ─────────────────────────────────────────────── -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash--{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- ── Page content ───────────────────────────────────────────────── -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Study Planner &mdash; stay on top of your coursework.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
